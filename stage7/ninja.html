<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>算数忍者ゲーム（繰り上がり・繰り下がり）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('../images/sea.png');
      background-size: cover;
      background-position: center;
      font-family: 'Arial', sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 { background-color: rgba(0,0,0,0.5); padding: 10px; margin: 0; }
    #game-container { padding-top: 50px; }
    #question { font-size: 2.5em; margin: 20px; text-shadow: 2px 2px 5px black; }
    .choice {
      display: inline-block;
      padding: 10px 20px;
      margin: 10px;
      background-color: rgba(0,128,0,0.8);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.5em;
      transition: transform 0.2s;
    }
    .choice:hover { transform: scale(1.1); background-color: rgba(0,128,0,1); }
    #result { font-size: 1.5em; margin-top: 20px; text-shadow: 2px 2px 5px black; }
    #score { margin-top: 30px; font-weight: bold; }
    #timer { font-size: 1.2em; margin-top: 10px; text-shadow: 1px 1px 3px black; }

    #ninja { position: absolute; top: 60%; left: -100px; width: 80px; z-index: 10; transition: left 5s linear; }
    #enemy { position: absolute; top: 60%; right: 50px; width: 80px; z-index: 9; }

    #fail-image { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 150px; z-index: 20; }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      background: #ff9800;
      color: white;
      border-radius: 8px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    @keyframes enemyDefeat {
      0%{transform:translateX(0)rotate(0deg);opacity:1;}
      25%{transform:translateX(-10px)rotate(-15deg);}
      50%{transform:translateX(10px)rotate(15deg);}
      75%{transform:translateX(-10px)rotate(-15deg);opacity:0.7;}
      100%{transform:translateX(0)rotate(0deg);opacity:0;}
    }
    .defeat{animation:enemyDefeat 1.5s forwards;}
  </style>
</head>
<body>
  <h1>算数忍者！（繰り上がり・繰り下がりの巻）</h1>
  <div id="game-container">
    <div id="question">Loading...</div>
    <div id="choices"></div>
    <div id="result"></div>
    <div id="score">スコア: 0</div>
    <div id="timer">残り時間: 5秒</div>
  </div>

  <img id="ninja" src="../images/ninja2.png" alt="忍者" />
  <img id="enemy" src="../images/enemy7.png" alt="敵" />

  <img class="ninja-pose" id="pose1" src="../images/ninja_pose1.png" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;z-index:100;" />
  <img class="ninja-pose" id="pose2" src="../images/ninja_pose2.png" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;z-index:100;" />
  <img class="ninja-pose" id="pose3" src="../images/ninja_pose3.png" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;z-index:100;" />
  <img id="fail-image" src="../images/fail.png" alt="不正解画像" />

  <img id="clear-image" src="../images/clear.png" alt="クリア" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;z-index:100;" />
  <img id="fail-clear-image" src="../images/fail_clear.png" alt="クリア失敗" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;z-index:100;" />

  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="sound-correct" src="sword_slash.mp3" preload="auto"></audio>
  <audio id="sound-wrong" src="damage_sound.mp3" preload="auto"></audio>
  <button id="start-btn" style="font-size:24px;padding:10px 30px;margin-top:50px;">スタート</button>

  <div id="gameover-buttons" style="display:none;position:fixed;bottom:20px;right:20px;z-index:110;">
    <button onclick="goToTitle()" style="margin:5px;">タイトルへ戻る</button>
    <button onclick="retryGame()" style="margin:5px;">リトライ</button>
  </div>

  <script>
    let score = 0;
    let clearcnt = 1;
    let currentAnswer = null;
    let timerInterval = null;
    let countdown = 5;
    let answered = false;
    let wrongCount = 0;
    let gameEnded = false;
    let stage_no = 7;

    window.onload = () => {
      const startBtn = document.getElementById('start-btn');
      const bgm = document.getElementById('bgm');

      startBtn.addEventListener('click', () => {
        bgm.volume = 0.3;
        bgm.play().catch(e => console.log("BGM再生に失敗:", e));
        startBtn.style.display = 'none';
        generateQuestion();
      });
    };

    document.getElementById('clear-image').addEventListener('click', () => {
      if (gameEnded) {
        window.location.href = '../tresure_select.html?stage=' + stage_no;
      }
    });

    // ★ 問題生成部分（繰り上がり・繰り下がり対応）
    function generateQuestion() {
      answered = false;
      countdown = 5;
      document.getElementById('timer').textContent = `残り時間: ${countdown}秒`;
      document.getElementById('result').textContent = '';
      document.getElementById('fail-image').style.display = 'none';
      const enemy = document.getElementById('enemy');
      enemy.style.display = 'block';

      let isAddition = Math.random() < 0.5;
      let a, b, expression;

      if (isAddition) {
        // --- 繰り上がりが発生する足し算（例：28 + 7 = 35）
        a = Math.floor(Math.random() * 5) * 10 + Math.floor(Math.random() * 5) + 5; // 15,16,17...など
        b = 10 - (a % 10) + Math.floor(Math.random() * 4); // 繰り上がるように
        currentAnswer = a + b;
        expression = `${a} ＋ ${b} = ?`;
      } else {
        // --- 繰り下がりが発生する引き算（例：42 - 8 = 34）
        a = Math.floor(Math.random() * 9) * 10 + Math.floor(Math.random() * 9) + 11; // 11〜99
        do {
          b = Math.floor(Math.random() * 9) + 2; // 2〜10
        } while (a % 10 < b); // 一の位で繰り下がり発生条件
        currentAnswer = a - b;
        expression = `${a} − ${b} = ?`;
      }

      document.getElementById('question').textContent = expression;
      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = '';

      // 選択肢生成
      let choices = [currentAnswer];
      while (choices.length < 4) {
        let fake = currentAnswer + Math.floor(Math.random() * 11) - 5;
        if (fake !== currentAnswer && fake >= 0 && !choices.includes(fake)) {
          choices.push(fake);
        }
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(choice => {
        const btn = document.createElement('div');
        btn.className = 'choice';
        btn.textContent = choice;
        btn.onclick = () => handleAnswer(choice);
        choicesContainer.appendChild(btn);
      });

      startTimer();
      startNinjaAnimation();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (answered) return;
        countdown--;
        document.getElementById('timer').textContent = `残り時間: ${countdown}秒`;
        if (countdown <= 0) {
          clearInterval(timerInterval);
          handleAnswer(null);
        }
      }, 1000);
    }

    function startNinjaAnimation() {
      const ninja = document.getElementById('ninja');
      ninja.style.transition = 'none';
      ninja.style.left = '-100px';
      setTimeout(() => {
        ninja.style.transition = 'left 5s linear';
        ninja.style.left = 'calc(100% - 130px)';
      }, 10);
    }

    function handleAnswer(selected) {
      if (answered || gameEnded) return;
      answered = true;
      clearInterval(timerInterval);

      const result = document.getElementById('result');
      const ninja = document.getElementById('ninja');
      const enemy = document.getElementById('enemy');
      const poses = document.querySelectorAll('.ninja-pose');
      const soundCorrect = document.getElementById('sound-correct');
      const soundWrong = document.getElementById('sound-wrong');

      ninja.style.display = 'none';
      poses.forEach(p => p.style.display = 'none');
      const pose = poses[Math.floor(Math.random() * poses.length)];

      if (selected === currentAnswer) {
        result.textContent = "⚔️せいかい！⚔️";
        result.style.color = "yellow";
        score += 1;
        pose.style.display = 'block';
        enemy.classList.add('defeat');
        soundCorrect.play();

        setTimeout(() => {
          pose.style.display = 'none';
          enemy.style.display = 'none';
          enemy.classList.remove('defeat');
          ninja.style.display = 'block';
          checkGameClear();
        }, 1500);
      } else {
        result.textContent = "まちがい💥";
        result.style.color = "orange";
        score = Math.max(0, score - 1);
        wrongCount++;
        showFailImage();
        soundWrong.play();
        setTimeout(() => { ninja.style.display = 'block'; checkGameClear(); }, 2000);
      }

      document.getElementById('score').textContent = `スコア: ${score}`;
    }

    function showFailImage() {
      const failImage = document.getElementById('fail-image');
      failImage.style.display = 'block';
      setTimeout(() => failImage.style.display = 'none', 1500);
    }

    function checkGameClear() {
      const clearImg = document.getElementById('clear-image');
      const failClearImg = document.getElementById('fail-clear-image');
      const gameoverBtns = document.getElementById('gameover-buttons');

      if (score >= clearcnt) {
        clearImg.style.display = 'block';
        gameEnded = true;
        let cleared = JSON.parse(localStorage.getItem("clearedStage") || "[]");
        if (!cleared.includes(stage_no)) {
          cleared.push(stage_no);
          localStorage.setItem("clearedStage", JSON.stringify(cleared));
        }
      } else if (wrongCount >= 3) {
        failClearImg.style.display = 'block';
        gameoverBtns.style.display = 'block';
        gameEnded = true;
      } else {
        generateQuestion();
      }
    }

    function goToTitle() { window.location.href = '../index.html'; }
    function retryGame() { window.location.reload(); }
  </script>
</body>
</html>
